[package]
name = "kingdom-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Kingdom IDE: Axum SSR server and Leptos browser UI."

[lib]
# cdylib for the wasm bundle, rlib for the native server binary.
crate-type = ["cdylib", "rlib"]

[dependencies]
kingdom-core.workspace = true
serde.workspace = true
# Needed on both targets: a `Deed`'s arguments are JSON, so the chamber renders
# them and the watch socket parses plans off the wire.
serde_json.workspace = true

leptos = { version = "0.8" }
leptos_meta = { version = "0.8" }
leptos_router = { version = "0.8" }

# Server-only (feature-gated so they never reach the wasm bundle).
leptos_axum = { version = "0.8", optional = true }
# `ws` for the chamber's push channel; see `watch.rs`.
axum = { version = "0.8", features = ["ws"], optional = true }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "process",
    # `broadcast`, which the herald fans a plan's changes out over.
    "sync",
    "time",
], optional = true }
# The model call. rustls rather than native-tls so there is no OpenSSL build
# dependency; no default features keeps the wasm-irrelevant bulk out.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
], optional = true }
async-trait = { version = "0.1", optional = true }
dotenvy = { version = "0.15", optional = true }
thiserror = { version = "2", optional = true }
# Names an isolated worktree's folder. v4 only -- the id needs to be unique and
# unguessable-ish, not sortable.
uuid = { version = "1", features = ["v4"], optional = true }

# Gitignore-aware walking + glob/regex matching, for the `search` tool. Optional
# so they never reach the wasm bundle.
ignore = { version = "0.4", optional = true }
globset = { version = "0.4", optional = true }
regex = { version = "1", optional = true }

# Process groups and signals for the `bash` tool: a command's children must die
# with it, which needs setpgid/kill on a negated pgid.
libc = { version = "0.2", optional = true }

# Client-only.
console_error_panic_hook = { version = "0.1", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
# Formats a log entry's UTC timestamp as the King's own local time. The browser
# is the only place that knows his timezone, so this is the only place that can.
js-sys = { version = "0.3", optional = true }

# Needed on both targets: the map reads element geometry to fit the view, and
# the sidebar persists its dragged width in localStorage.
web-sys = { version = "0.3", features = [
    "DomRect",
    "DomTokenList",
    "Element",
    "HtmlElement",
    "Location",
    "MessageEvent",
    "MouseEvent",
    "Storage",
    "WebSocket",
    "WheelEvent",
    "Window",
] }

[dev-dependencies]
# A throwaway git repository for the worktree tests. Nothing in the product
# needs it: preparing a workspace is only meaningfully testable against a real
# repo on a real disk.
tempfile = "3"

[features]
default = ["ssr"]
hydrate = [
    "leptos/hydrate",
    "dep:console_error_panic_hook",
    "dep:wasm-bindgen",
    "dep:js-sys",
]
ssr = [
    "dep:axum",
    "dep:tokio",
    "dep:leptos_axum",
    "dep:reqwest",
    "dep:async-trait",
    "dep:dotenvy",
    "dep:thiserror",
    "dep:uuid",
    "dep:ignore",
    "dep:globset",
    "dep:regex",
    "dep:libc",
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
]
