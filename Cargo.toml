[workspace]
resolver = "2"
members = [
    "crates/kingdom-core",
    "crates/kingdom-app",
    "crates/kingdom-browser",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
kingdom-core = { path = "crates/kingdom-core" }
kingdom-browser = { path = "crates/kingdom-browser" }
serde = { version = "1", features = ["derive"] }
# A tool call's arguments are the model's JSON, not a shape we declared, so the
# domain stores them as JSON. Pure Rust and no I/O, so it still compiles to wasm.
serde_json = "1"

# Markdown, parsed. `kingdom-app` renders it and `kingdom-core` splits a
# proposal into the blocks the King annotates -- both from this one parser, so
# "where does a block begin" is answered identically on each side of the wire.
# `default-features = false` keeps it pure Rust with no I/O, which is what lets
# it into a crate that must compile to wasm.
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }

# Diffing. `tools/patch.rs` reports where an edit landed with it; `kingdom-core`
# reads one proposal against the one it revises. Its only use of `std::time` is
# a deadline path documented as a no-op on wasm, so it crosses to the browser.
similar = "2"

# Release profile for the wasm bundle: optimise for size, since this ships to a browser.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

# cargo-leptos configuration ------------------------------------------------
# Drives the two-target build: a native SSR server binary + a wasm client bundle.
[[workspace.metadata.leptos]]
name = "kingdom-ide"
bin-package = "kingdom-app"
# Disambiguates the server binary from `kingdom-seed`, which lives in the same
# package but is a one-shot CLI cargo-leptos should not try to serve.
bin-target = "kingdom-app"
lib-package = "kingdom-app"

site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "style/main.scss"
assets-dir = "public"

site-addr = "127.0.0.1:3000"
reload-port = 3001

browserquery = "defaults"
watch = false
env = "DEV"

bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
lib-profile-release = "wasm-release"
