[workspace]
resolver = "2"
members = [
    "crates/kingdom-core",
    "crates/kingdom-app",
    "crates/kingdom-browser",
    "crates/kingdom-citymap",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
kingdom-core = { path = "crates/kingdom-core" }
kingdom-browser = { path = "crates/kingdom-browser" }
# The map. A path dependency on vendored code -- Repo City, copied into this
# repository rather than fetched, so there is one project to maintain.
kingdom-citymap = { path = "crates/kingdom-citymap" }
serde = { version = "1", features = ["derive"] }
# A tool call's arguments are the model's JSON, not a shape we declared, so the
# domain stores them as JSON. Pure Rust and no I/O, so it still compiles to wasm.
serde_json = "1"

# Markdown, parsed. `kingdom-app` renders it and `kingdom-core` splits a
# proposal into the blocks the King annotates -- both from this one parser, so
# "where does a block begin" is answered identically on each side of the wire.
# `default-features = false` keeps it pure Rust with no I/O, which is what lets
# it into a crate that must compile to wasm.
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }

# Diffing. `tools/patch.rs` reports where an edit landed with it; `kingdom-core`
# reads one proposal against the one it revises; and `kingdom-app::review` pairs
# a changed file into side-by-side rows. Its only use of `std::time` is a
# deadline path documented as a no-op on wasm, so it crosses to the browser.
#
# `inline` is what emphasises the words *within* a changed line rather than only
# the line -- the review drawer's diff panel is built on it.
similar = { version = "2", features = ["inline"] }

# Release profile for the wasm bundle: optimise for size, since this ships to a browser.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

# Dev profile for the wasm bundle.
#
# This exists because `cargo leptos watch` -- the loop AGENTS.md documents as
# *the* way to run Kingdom -- otherwise builds the client with plain `dev`, and
# a plain `dev` client is a browser artifact rather than a native one. Measured
# on this workspace before the profile existed: 344.7 MB served for one page
# load, 71% of it debug symbols, the rest compiled at opt-level 0. That was
# survivable while the client was Leptos and some SVG; with Bevy, wgpu and a
# ~38,000-entity scene it is not.
#
# cargo-leptos runs `wasm-opt` on release only (its `compile/front.rs` guards
# the call on `proj.release`), so in dev this profile is the only lever there
# is -- nothing downstream recovers what is left unoptimised here.
#
# It is a *named* profile rather than an edit to `[profile.dev]` on purpose.
# `lib-profile-dev` below applies it to the client bundle alone, so the Axum
# server and `cargo test` keep building exactly as they did; widening `dev`
# would slow both to fix neither.
[profile.wasm-dev]
inherits = "dev"
# The bundle is downloaded and compiled by a browser on every reload, and DWARF
# debug info was the bulk of it. Measured on this workspace: 344.7 MB before,
# 111.6 MB after, and wasm CPU time on an idle map fell 4.8x (4136ms -> 858ms
# over six seconds) because this profile also stops shipping opt-level 0 code.
#
# This does *not* strip the `name` section, which is still ~50 MB of the
# remainder -- `debug = false` drops DWARF, and symbol names are a separate
# thing. `strip = "symbols"` would take those too, and was deliberately not
# used: the names are what turns a `console_error_panic_hook` backtrace from
# `wasm-function[12345]` into a Rust function name, and Kingdom is served over
# loopback where the remaining bytes cost ~0.2s. Debuggability is worth more
# than that here. On a release build `wasm-release` and `wasm-opt` handle it.
debug = false

# Bevy, wgpu and hashbrown are the hot loops here, and they are never what is
# being edited -- so they are pure cost to leave unoptimised. Their ECS inner
# loops (`QueryIter::next`, `RawTable` lookups) dominated a profile of the map
# sitting still, purely for want of inlining. Optimising dependencies costs one
# slow build and nothing afterwards, because they are not rebuilt on a save.
[profile.wasm-dev.package."*"]
opt-level = 3

# Kingdom's own crates stay cheap to rebuild: these *are* what gets edited, so
# they are the only ones whose compile time is paid on every save. 1 buys most
# of the gap between a debug and a release build without that cost.
[profile.wasm-dev.package.kingdom-citymap]
opt-level = 1
[profile.wasm-dev.package.kingdom-app]
opt-level = 1
[profile.wasm-dev.package.kingdom-core]
opt-level = 1

# The syntax highlighter, optimised even in a debug build.
#
# `[profile.wasm-dev]` above says why for the client; this is the same argument
# for the *server*, which `cargo leptos watch` builds with plain `dev`. Syntect
# is a regex engine walking a file character by character, and unoptimised it is
# roughly 16x slower: measured on this workspace, tokenising `model.rs` (4,735
# lines) took 5.4s at opt-level 0 and 350ms released. 5.4s is long enough to
# make opening a file in the source panel feel broken during development, and
# the whole point of that panel is that it answers immediately.
#
# These crates are never what is being edited, so the cost is one slow build and
# nothing afterwards -- with these entries the same file tokenises in 1.15s on a
# debug server. Release builds are unaffected; they already optimise everything.
[profile.dev.package.syntect]
opt-level = 3
[profile.dev.package.fancy-regex]
opt-level = 3
[profile.dev.package.regex-automata]
opt-level = 3
[profile.dev.package.bincode]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3

# cargo-leptos configuration ------------------------------------------------
# Drives the two-target build: a native SSR server binary + a wasm client bundle.
[[workspace.metadata.leptos]]
name = "kingdom-ide"
bin-package = "kingdom-app"
# Disambiguates the server binary from `kingdom-seed`, which lives in the same
# package but is a one-shot CLI cargo-leptos should not try to serve.
bin-target = "kingdom-app"
lib-package = "kingdom-app"

site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "style/main.scss"
assets-dir = "public"

site-addr = "127.0.0.1:3000"
reload-port = 3001

browserquery = "defaults"
watch = false
env = "DEV"

bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
lib-profile-release = "wasm-release"
# See `[profile.wasm-dev]` above: this is what makes `cargo leptos watch` serve
# an optimised bundle instead of a third of a gigabyte of debug symbols.
lib-profile-dev = "wasm-dev"

# cargo-leptos otherwise runs `wasm-opt -Oz --enable-bulk-memory
# --enable-nontrapping-float-to-int`, and the renderer needs two more features
# than that: rustc emits sign-extension and bulk-memory-opt instructions that
# wasm-opt validates against the bare MVP set unless told otherwise, and a
# release build fails with "error validating input". Repo City's own Trunk
# config carried the same list for the same reason.
wasm-opt-features = [
    "-Oz",
    "--enable-bulk-memory",
    "--enable-bulk-memory-opt",
    "--enable-nontrapping-float-to-int",
    "--enable-sign-ext",
]
